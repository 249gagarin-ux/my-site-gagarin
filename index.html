
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дизайн карточек для маркетплейсов</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#0f0f1a; color:#fff; }

  /* СТОЛБИК КНОПОК СЛЕВА */
  .sidebar {
    position:fixed; left:0; top:0; bottom:0; width:220px;
    background:#16162a; padding:25px 15px;
    display:flex; flex-direction:column; gap:10px;
    border-right:1px solid #262640;
  }
  .logo { font-size:20px; font-weight:700; margin-bottom:20px; text-align:center; }
  .logo span { color:#a855f7; }
  .side-btn {
    background:#1f1f38; color:#ccc; border:none; padding:12px;
    border-radius:10px; cursor:pointer; font-size:14px;
    text-align:left; text-decoration:none; display:block; transition:.2s;
  }
  .side-btn:hover { background:#2a2a4a; color:#fff; }
  .order-btn {
    background:linear-gradient(90deg,#a855f7,#ff6b35);
    color:#fff; font-weight:700; text-align:center; margin-top:10px;
  }

  .main { margin-left:220px; padding:25px 35px; }

  /* ШАПКА С КАРТИНКАМИ */
  .hero { border-radius:16px; overflow:hidden; position:relative; margin-bottom:35px; }
  .hero img { width:100%; display:block; }
  .hero-text {
    position:absolute; left:30px; bottom:25px;
    background:rgba(15,15,26,.75); padding:15px 25px; border-radius:12px;
  }
  .hero-text h1 { font-size:26px; }
  .hero-text p { color:#bbb; font-size:14px; }

  /* ПОРТФОЛИО 3x3 */
  .section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .add-btn { background:#22c55e; border:none; color:#fff; padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .card { background:#16162a; border-radius:14px; overflow:hidden; border:1px solid #262640; display:flex; flex-direction:column; }
  .card img { width:100%; height:220px; object-fit:cover; }
  .card-body { padding:15px; flex:1; display:flex; flex-direction:column; gap:8px; }
  .card-title { font-weight:600; font-size:15px; }
  .card-price { color:#a855f7; font-weight:700; font-size:18px; }
  .card-btn { margin-top:auto; background:#a855f7; border:none; color:#fff; padding:9px; border-radius:8px; cursor:pointer; }

  /* ЧАТ */
  .chat-box {
    position:fixed; right:25px; bottom:25px; width:320px;
    background:#16162a; border:1px solid #262640; border-radius:14px;
    display:none; flex-direction:column; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .chat-head { background:#a855f7; padding:12px 15px; display:flex; justify-content:space-between; font-weight:600; }
  .chat-head button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; }
  .chat-msgs { height:250px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:80%; }
  .msg.user { background:#a855f7; align-self:flex-end; }
  .msg.bot { background:#262640; align-self:flex-start; }
  .chat-input { display:flex; border-top:1px solid #262640; }
  .chat-input input { flex:1; background:none; border:none; color:#fff; padding:12px; outline:none; }
  .chat-input button { background:#a855f7; border:none; color:#fff; padding:0 18px; cursor:pointer; }
</style>
</head>
<body>

<!-- СТОЛБИК КНОПОК СЛЕВА -->
<aside class="sidebar">
  <div class="logo">Design<span>UA</span></div>
  <a class="side-btn" href="#">🏠 Главная</a>
  <a class="side-btn" href="#portfolio">🖼 Портфолио</a>
  <a class="side-btn" href="#">💼 Услуги</a>
  <a class="side-btn" href="#">⭐ Отзывы</a>
  <a class="side-btn" href="#">📞 Контакты</a>
  <button class="side-btn order-btn" onclick="openChat('Общий заказ')">🛒 ЗАКАЗАТЬ</button>
</aside>

<div class="main">

  <!-- ШАПКА С КАРТИНКАМИ -->
  <div class="hero">
    <img src="banner.jpg" alt="Карточки маркетплейсов">
    <div class="hero-text">
      <h1>Дизайн карточек для маркетплейсов</h1>
      <p>Rozetka • Prom • OLX — карточки, которые продают</p>
    </div>
  </div>

  <!-- ПОРТФОЛИО 3x3 С ЦЕНАМИ -->
  <div class="section-head" id="portfolio">
    <h2>Портфолио</h2>
    <button class="add-btn" onclick="addCard()">+ Добавить карточку</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- ЧАТ ДЛЯ ЗАКАЗОВ -->
<div class="chat-box" id="chat">
  <div class="chat-head">
    <span id="chatTitle">Заказ</span>
    <button onclick="closeChat()">✕</button>
  </div>
  <div class="chat-msgs" id="msgs"></div>
  <div class="chat-input">
    <input id="msgInput" placeholder="Ваше сообщение..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
  const imgs = ['card1.jpg','card2.jpg','card3.jpg'];
  const works = [
    ['Сыворотка для лица','800 ₴'], ['Худи оверсайз','600 ₴'], ['Наушники TWS','700 ₴'],
    ['Чайник электрический','650 ₴'], ['Кроссовки белые','750 ₴'], ['Крем для лица','800 ₴'],
    ['Футболка базовая','500 ₴'], ['Смарт-часы','900 ₴'], ['Рюкзак городской','700 ₴']
  ];
  const grid = document.getElementById('grid');
  works.forEach((w,i)=> grid.innerHTML += cardHTML(w[0], w[1], imgs[i%3]));

  function cardHTML(name, price, img){
    return `<div class="card">
      <img src="${img}">
      <div class="card-body">
        <div class="card-title">${name}</div>
        <div class="card-price">${price}</div>
        <button class="card-btn" onclick="openChat('${name}')">Заказать</button>
      </div>
    </div>`;
  }

  // ДОБАВЛЕНИЕ КАРТОЧКИ
  function addCard(){
    const name = prompt('Название карточки:');
    if(!name) return;
    const price = (prompt('Цена в ₴:') || '500') + ' ₴';
    grid.innerHTML += cardHTML(name, price, imgs[grid.children.length % 3]);
  }

  // ЧАТ
  function openChat(title){
    document.getElementById('chatTitle').textContent = 'Заказ: ' + title;
    document.getElementById('chat').style.display = 'flex';
    document.getElementById('msgs').innerHTML =
      '<div class="msg bot">Здравствуйте! Опишите задачу: какой товар и для какого маркетплейса?</div>';
  }
  function closeChat(){ document.getElementById('chat').style.display = 'none'; }
  function sendMsg(){
    const inp = document.getElementById('msgInput');
    const text = inp.value.trim();
    if(!text) return;
    const msgs = document.getElementById('msgs');
    msgs.innerHTML += `<div class="msg user">${text}</div>`;
    inp.value = '';
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(()=>{
      msgs.innerHTML += `<div class="msg bot">Принял! Скоро отвечу подробно. Срочно — Telegram @ваш_ник</div>`;
      msgs.scrollTop = msgs.scrollHeight;
    }, 800);
  }
</script>
</body>
</html>.
